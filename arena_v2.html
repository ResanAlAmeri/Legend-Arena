<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Legend Arena Alpha 2</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- STARTMENY -->

<main
id="menu-screen"
class="screen active">

<div class="menu-card">

<h1 class="menu-title">
🛡️ LEGEND ARENA
</h1>

<p class="menu-subtitle">
Kämpa. Samla Legend Coins.
Bli Legend Champion.
</p>

<button
id="play-button"
class="menu-button">

▶ SPELA

</button>

<button
class="menu-button secondary">

🦸 HJÄLTAR

</button>

<button
class="menu-button secondary">

🎨 SKINS

</button>

<button
class="menu-button secondary">

🏆 RANKING

</button>

</div>

</main>
<!-- SPELSKÄRM -->

<main
id="game-screen"
class="screen">

<header class="top-bar">

<div class="stat-box">
🪙 <span id="coin-counter">0</span>
</div>

<h2 class="game-title">
LEGEND ARENA
</h2>

<div class="stat-box right">
Poäng: <span id="score">0</span>
</div>

</header>

<div class="health-bar">
<div
id="health-fill"
class="health-fill">
</div>
</div>

<div class="health-bar">
<div
id="ultimate-fill"
class="health-fill"
style="width:0%">
</div>
</div>

<p
id="message"
class="message">

Samla Legend Coins och undvik fiender!

</p>

<section id="game">

<div
id="hero"
class="hero">
</div>

</section>

<section class="controls">

<button
id="left-button"
class="control-button">

◀

</button>

<button
id="dash-button"
class="control-button dash">

⚡ DASH

</button>

<button
id="right-button"
class="control-button">

▶

</button>

</section>

<button
id="ultimate-button"
class="menu-button">

🌪️ ULTIMATE 0%

</button>

<button
id="back-button"
class="menu-button secondary">

← TILL MENYN

</button>

</main>
<!-- GAME OVER -->

<main
id="game-over-screen"
class="screen">

<section class="menu-card">

<h1 class="menu-title">
💀 GAME OVER
</h1>

<p class="menu-subtitle">
Din poäng:
<strong id="final-score">0</strong>
</p>

<p class="menu-subtitle">
High score:
<strong id="high-score">0</strong>
</p>

<p class="menu-subtitle">
Totala Legend Coins:
<strong id="total-coins">0</strong>
</p>

<button
id="restart-button"
class="menu-button">

🔄 SPELA IGEN

</button>

<button
class="menu-button secondary"
onclick="location.reload()">

🏠 TILL STARTMENYN

</button>

</section>

</main>

<script src="game_v2.js"></script>

</body>
</html>
